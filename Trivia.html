<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia</title>
<style>
:root{--bg:#f4f2ff;--ink:#1a1740;--card:#fff;--acc:#5b3df5;--on:#fff;--ok:#12a150;--ko:#e5484d;--mut:#6b6a8a;--line:#d8d4f3;--hot:#e08a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102e;--ink:#f1efff;--card:#1d1a45;--acc:#8c7bff;--on:#12102e;--ok:#3ddc84;--ko:#ff6b70;--mut:#a09fcb;--line:#2e2a63;--hot:#ffc233;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12102e;--ink:#f1efff;--card:#1d1a45;--acc:#8c7bff;--on:#12102e;--ok:#3ddc84;--ko:#ff6b70;--mut:#a09fcb;--line:#2e2a63;--hot:#ffc233;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:18px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:clamp(44px,14vw,72px);line-height:1;font-weight:900;letter-spacing:-.04em;text-shadow:4px 4px 0 var(--acc)}
h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);margin:10px 0}
.lg,.seg{display:flex;gap:6px}
.seg button{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
select{width:100%}
button.on{border-color:var(--acc);background:var(--acc);color:var(--on);font-weight:700}
.go{width:100%;margin-top:24px;background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:800;font-size:18px;padding:15px}
.ghost{width:100%;margin-top:10px}
.best{text-align:center;color:var(--mut)}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.sk{color:var(--hot)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.tm i{background:var(--hot);width:100%;transition:width .1s linear}
.qt{font-size:clamp(20px,5.5vw,26px);line-height:1.3;color:var(--ink);margin:22px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-size:17px;padding:14px 16px;min-height:52px}
.opt:disabled{cursor:default;opacity:.6}
.opt.ok{background:var(--ok);border-color:var(--ok);color:var(--on);opacity:1;font-weight:700}
.opt.ko{background:var(--ko);border-color:var(--ko);color:var(--on);opacity:1}
.fb p{margin:16px 0 0;font-weight:700}
.g{color:var(--ok)}.b{color:var(--ko)}
.big{font-size:88px;font-weight:900;margin:0;text-align:center;line-height:1.1}
.sub{text-align:inherit}
@media (min-width:600px){#app{padding-top:40px}.opts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.tm i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),P=a=>a[R(a.length)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=ls.get('tv_lang',/^fr/i.test(navigator.language)?'fr':'en'),L=+ls.get('tv_lvl',1),cat=ls.get('tv_cat','all');
const tr=s=>{const p=s.split('~');return lang=='fr'?p[0]:p[1]||p[0]},I=()=>lang=='fr'?0:1,QM=()=>lang=='fr'?'\u00a0?':'?';
const S={fr:{sub:'Des milliers de questions, trois niveaux.',lvl:['Facile','Moyen','Difficile'],cat:{all:'Toutes les catégories',geo:'Géographie',sci:'Sciences',math:'Calcul',log:'Logique',cul:'Culture générale'},level:'Niveau',topic:'Thème',play:'Jouer',best:'Meilleur score',q:'Question',pts:'Score',next:'Suivant',res:'Voir le résultat',good:'Bonne réponse !',bad:'Raté. Réponse : ',late:'Temps écoulé. Réponse : ',done:'Partie terminée',again:'Rejouer',home:'Accueil',rec:'Nouveau record !'},
en:{sub:'Thousands of questions, three levels.',lvl:['Easy','Medium','Hard'],cat:{all:'All categories',geo:'Geography',sci:'Science',math:'Math',log:'Logic',cul:'General knowledge'},level:'Level',topic:'Topic',play:'Play',best:'Best score',q:'Question',pts:'Score',next:'Next',res:'See result',good:'Correct!',bad:'Wrong. Answer: ',late:'Time’s up. Answer: ',done:'Game over',again:'Play again',home:'Home',rec:'New record!'}};

const mk=(q,c,w)=>{const u=[...new Set(w.map(String))].filter(x=>x!=String(c)).slice(0,3);return{q,c:String(c),o:sh([String(c),...u])}};

/* Géographie : capitales (fr|en|capitale fr|capitale en|niveau) */
const CAP=`France||Paris||1
Italie|Italy|Rome||1
Espagne|Spain|Madrid||1
Allemagne|Germany|Berlin||1
Royaume-Uni|United Kingdom|Londres|London|1
États-Unis|United States|Washington||1
Japon|Japan|Tokyo||1
Chine|China|Pékin|Beijing|1
Russie|Russia|Moscou|Moscow|1
Canada||Ottawa||1
Brésil|Brazil|Brasilia||1
Égypte|Egypt|Le Caire|Cairo|1
Portugal||Lisbonne|Lisbon|1
Grèce|Greece|Athènes|Athens|1
Belgique|Belgium|Bruxelles|Brussels|1
Suisse|Switzerland|Berne|Bern|1
Inde|India|New Delhi||1
Mexique|Mexico|Mexico|Mexico City|1
Australie|Australia|Canberra||2
Argentine|Argentina|Buenos Aires||2

Pologne|Poland|Varsovie|Warsaw|2

Norvège|Norway|Oslo||2
Autriche|Austria|Vienne|Vienna|2
Irlande|Ireland|Dublin||2

Thaïlande|Thailand|Bangkok||2
Pays-Bas|Netherlands|Amsterdam||2
Danemark|Denmark|Copenhague|Copenhagen|2
Finlande|Finland|Helsinki||2
Cuba||La Havane|Havana|2
Pérou|Peru|Lima||2
Chili|Chile|Santiago||2
Colombie|Colombia|Bogota||2
Algérie|Algeria|Alger|Algiers|2
Nigeria||Abuja||2
Kenya||Nairobi||2
Arabie saoudite|Saudi Arabia|Riyad|Riyadh|2
Iran||Téhéran|Tehran|2
Ukraine||Kyiv||2
RD Congo|DR Congo|Kinshasa||3
Congo||Brazzaville||3
Sénégal|Senegal|Dakar||3
Côte d’Ivoire|Ivory Coast|Yamoussoukro||3
Cameroun|Cameroon|Yaoundé||3
Mongolie|Mongolia|Oulan-Bator|Ulaanbaatar|3
Kazakhstan||Astana||3
Nouvelle-Zélande|New Zealand|Wellington||3
Vietnam||Hanoï|Hanoi|3
Pakistan||Islamabad||3
Tanzanie|Tanzania|Dodoma||3
Slovaquie|Slovakia|Bratislava||3
Lituanie|Lithuania|Vilnius||3
Madagascar||Antananarivo||3
Éthiopie|Ethiopia|Addis-Abeba|Addis Ababa|3
Ghana||Accra||3
Angola||Luanda||3
Zambie|Zambia|Lusaka||3
Burkina Faso||Ouagadougou||3
Mali||Bamako||3
Tchad|Chad|N’Djamena||3
Niger||Niamey||3
Birmanie|Myanmar|Naypyidaw||3`.split('\n').map(s=>{const[a,b,c,d,l]=s.split('|');return{c:[a,b||a],k:[c,d||c],l:+l}});
const geo=()=>{const i=I(),e=P(CAP.filter(x=>x.l==L)),o=sh(CAP.filter(x=>x!=e));
return R(2)?mk(lang=='fr'?`Quelle est la capitale de ce pays : ${e.c[i]}${QM()}`:`What is the capital of ${e.c[i]}?`,e.k[i],o.map(x=>x.k[i]))
:mk(lang=='fr'?`${e.k[i]} est la capitale de quel pays${QM()}`:`${e.k[i]} is the capital of which country?`,e.c[i],o.map(x=>x.c[i]))};

/* Sciences : éléments chimiques (symbole|fr|en|niveau) */
const EL=`H|Hydrogène|Hydrogen|1
He|Hélium|Helium|1
C|Carbone|Carbon|1
O|Oxygène|Oxygen|1
Fe|Fer|Iron|1
Cu|Cuivre|Copper|1
Ag|Argent|Silver|1
Au|Or|Gold|1
Li|Lithium||2
N|Azote|Nitrogen|2
Na|Sodium||2
Mg|Magnésium|Magnesium|2
Al|Aluminium|Aluminum|2
Si|Silicium|Silicon|2
S|Soufre|Sulfur|2
Cl|Chlore|Chlorine|2
Ca|Calcium||2
Zn|Zinc||2
Hg|Mercure|Mercury|2
Pb|Plomb|Lead|2
Ne|Néon|Neon|2
F|Fluor|Fluorine|2
P|Phosphore|Phosphorus|3
K|Potassium||3
Sn|Étain|Tin|3

Ar|Argon||3

I|Iode|Iodine|3

B|Bore|Boron|3`.split('\n').map(s=>{const[a,b,c,l]=s.split('|');return{s:a,n:[b,c||b],l:+l}});
const elf=()=>{const i=I(),e=P(EL.filter(x=>x.l==L)),o=sh(EL.filter(x=>x!=e));
return R(2)?mk(lang=='fr'?`Quel est le symbole chimique de l’élément « ${e.n[i]} »${QM()}`:`What is the chemical symbol of ${e.n[i]}?`,e.s,o.map(x=>x.s))
:mk(lang=='fr'?`Quel élément a pour symbole ${e.s}${QM()}`:`Which element has the symbol ${e.s}?`,e.n[i],o.map(x=>x.n[i]))};

/* Calcul : générateur illimité */
const near=c=>{const w=[];for(let k=0;k<40&&w.length<8;k++){const x=c+P([1,2,10,R(Math.max(9,Math.round(c*.12)))+1])*P([1,-1]);if(x>=0&&x!=c)w.push(x)}return w};
const mth=()=>{let q,c;
if(L==1){const t=R(3),a=R(50)+10,b=R(40)+5;
 if(t==0){q=`${a} + ${b}`;c=a+b}else if(t==1){q=`${a+b} − ${b}`;c=a}else{const x=R(8)+2,y=R(9)+2;q=`${x} × ${y}`;c=x*y}}
else if(L==2){const t=R(4);
 if(t==0){const a=R(10)+11,b=R(8)+4;q=`${a} × ${b}`;c=a*b}
 else if(t==1){const a=R(400)+100,b=R(400)+100;q=`${a} + ${b}`;c=a+b}
 else if(t==2){const p=P([5,10,20,25,50]),n=20*(R(20)+2);q=lang=='fr'?`${p} % de ${n}`:`${p}% of ${n}`;c=n*p/100}
 else{const b=R(11)+3,r=R(15)+6;q=`${b*r} ÷ ${b}`;c=r}}
else{const t=R(5);
 if(t==0){const a=R(18)+12,b=R(18)+12;q=`${a} × ${b}`;c=a*b}
 else if(t==1){const a=R(20)+21;q=`${a}²`;c=a*a}
 else if(t==2){const n=R(9)+8;q=`2^${n}`;c=2**n}
 else if(t==3){const r=R(20)+13;q=`√${r*r}`;c=r}
 else{const a=R(10)+6,b=R(10)+6,d=R(90)+10;q=`${a} × ${b} + ${d}`;c=a*b+d}}
return mk(lang=='fr'?`Combien font ${q}${QM()}`:`What is ${q}?`,c,near(c))};

/* Logique : chiffres romains et suites */
const rom=n=>{let r='';for(const[v,s]of[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v){r+=s;n-=v}return r};
const rmn=()=>{const n=L==1?R(19)+2:L==2?R(80)+21:R(3800)+100,ws=[];
for(let k=0;k<10;k++){const m=n+P([1,-1,2,-2,3,-3,4,5,-5,10,-10]);if(m>0&&m!=n)ws.push(m)}
return R(2)?mk(lang=='fr'?`Que vaut ${rom(n)}${QM()}`:`What number is ${rom(n)}?`,n,ws)
:mk(lang=='fr'?`Comment écrit-on ${n} en chiffres romains${QM()}`:`How do you write ${n} in Roman numerals?`,rom(n),ws.map(rom))};
const seq=()=>{let a,c;
if(L==1){const d=R(5)+2,s=R(10);a=[0,1,2,3].map(i=>s+d*i);c=s+d*4}
else if(L==2){if(R(2)){const m=R(2)+2,s=R(4)+1;a=[0,1,2,3].map(i=>s*m**i);c=s*m**4}else{const d=R(9)+7,s=R(30);a=[0,1,2,3].map(i=>s+d*i);c=s+d*4}}
else{const t=R(3);
 if(t==0){const n=R(9)+2;a=[0,1,2,3].map(i=>(n+i)**2);c=(n+4)**2}
 else if(t==1){a=[R(4)+1,R(5)+2];for(let i=0;i<3;i++)a.push(a[i]+a[i+1]);c=a[3]+a[4]}
 else{const k=R(3)+1;a=[R(10)];for(let i=0;i<3;i++)a.push(a[i]+k+i);c=a[3]+k+3}}
return mk(lang=='fr'?`Quel nombre complète la suite : ${a.join(', ')}, ?`:`Which number continues the sequence: ${a.join(', ')}, ?`,c,near(c))};

/* Culture générale (niveau|question fr|question en|bonne réponse|3 mauvaises ; fr~en si traduction) */

1|Quelle planète est la plus proche du Soleil ?|Which planet is closest to the Sun?|Mercure~Mercury|Vénus~Venus|Mars|Terre~Earth

1|Quel est le plus haut sommet du monde ?|What is the highest mountain in the world?|Everest|K2|Mont Blanc|Kilimandjaro~Kilimanjaro
1|Qui a écrit « Les Misérables » ?|Who wrote “Les Misérables”?|Victor Hugo|Émile Zola|Alexandre Dumas|Honoré de Balzac

1|Quel est le plus grand désert chaud du monde ?|What is the largest hot desert in the world?|Sahara|Gobi|Kalahari|Atacama
1|Quelle est la formule chimique de l’eau ?|What is the chemical formula of water?|H₂O|CO₂|O₂|NaCl

1|Combien de cordes a un violon ?|How many strings does a violin have?|4|5|6|3
2|En quelle année le mur de Berlin est-il tombé ?|In what year did the Berlin Wall fall?|1989|1991|1985|1979
2|Qui a découvert la pénicilline ?|Who discovered penicillin?|Alexander Fleming|Louis Pasteur|Marie Curie|Robert Koch

2|Quel pays a gagné la Coupe du monde de football en 2018 ?|Which country won the 2018 football World Cup?|France|Croatie~Croatia|Belgique~Belgium|Brésil~Brazil
2|Qui a déposé le brevet du téléphone en 1876 ?|Who patented the telephone in 1876?|Alexander Graham Bell|Thomas Edison|Nikola Tesla|Guglielmo Marconi
2|Qui a formulé la théorie de la relativité générale ?|Who developed the theory of general relativity?|Albert Einstein|Isaac Newton|Niels Bohr|Max Planck

3|Quelle est la plus haute montagne d’Afrique ?|What is the highest mountain in Africa?|Kilimandjaro~Kilimanjaro|Mont Kenya~Mount Kenya|Mont Stanley~Mount Stanley|Toubkal`.split('\n').map(s=>s.split('|'));
const cul=()=>{const e=P(CU.filter(x=>x[0]==L));return mk(lang=='fr'?e[1]:e[2],tr(e[3]),e.slice(4).map(tr))};

const G={geo:[geo],sci:[elf],math:[mth],log:[rmn,seq],cul:[cul]};
const gen=()=>P(cat=='all'?Object.values(G).flat():G[cat])();

/* Jeu */
const app=$('#app'),N=10,TM=20;let st=null,timer=null;
function home(){clearInterval(timer);const s=S[lang];
app.innerHTML=`<header class="top"><h1>TRIVIA</h1><div class="lg">${['fr','en'].map(x=>`<button data-lang="${x}" class="${x==lang?'on':''}" aria-pressed="${x==lang}">${x.toUpperCase()}</button>`).join('')}</div></header>
<p class="sub">${s.sub}</p>
<h2>${s.level}</h2><div class="seg">${s.lvl.map((t,i)=>`<button data-lvl="${i+1}" class="${i+1==L?'on':''}">${t}</button>`).join('')}</div>
<h2>${s.topic}</h2><select id="cat" aria-label="${s.topic}">${Object.entries(s.cat).map(([k,v])=>`<option value="${k}" ${k==cat?'selected':''}>${v}</option>`).join('')}</select>
<button class="go" data-go="1">${s.play}</button><p class="best">${s.best} : ${ls.get('tv_best'+L,0)}</p>`}
function play(){st={n:0,sc:0,ok:0,sk:0,used:new Set(),t:TM,done:false};next()}
function next(){if(st.n>=N)return end();let q,k=0;do{q=gen()}while(st.used.has(q.q)&&++k<40);
st.used.add(q.q);st.q=q;st.n++;st.done=false;st.t=TM;render();clearInterval(timer);timer=setInterval(tick,100)}
function tick(){st.t-=.1;const b=$('#tb');if(b)b.style.width=Math.max(0,st.t/TM*100)+'%';if(st.t<=0)answer(-1)}
function render(){const s=S[lang],q=st.q;
app.innerHTML=`<div class="hud"><span>${s.q} ${st.n}/${N}</span><span class="sk">${st.sk>1?'🔥 '+st.sk:''}</span><span>${s.pts} <b id="sc">${st.sc}</b></span></div>
<div class="bar"><i style="width:${st.n/N*100}%"></i></div><div class="bar tm"><i id="tb"></i></div>
<h2 class="qt">${q.q}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${o}</button>`).join('')}</div><div id="fb" class="fb"></div>`}
function answer(i){if(st.done)return;st.done=true;clearInterval(timer);const q=st.q,s=S[lang],ci=q.o.indexOf(q.c),good=i==ci;
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j==ci)b.classList.add('ok');else if(j==i)b.classList.add('ko')});
let m;if(good){const p=10*L+Math.ceil(st.t/2);st.sc+=p;st.ok++;st.sk++;m=`${s.good} +${p}`}else{st.sk=0;m=(i<0?s.late:s.bad)+q.c}
$('#sc').textContent=st.sc;$('.sk').textContent=st.sk>1?'🔥 '+st.sk:'';
$('#fb').innerHTML=`<p class="${good?'g':'b'}">${m}</p><button class="go" data-next="1">${st.n>=N?s.res:s.next}</button>`;
$('[data-next]').focus()}
function end(){clearInterval(timer);const s=S[lang],k='tv_best'+L,b=+ls.get(k,0),nr=st.sc>b;if(nr)ls.set(k,st.sc);
app.innerHTML=`<h2 class="qt">${s.done}</h2><p class="big">${st.sc}</p><p class="sub" style="text-align:center">${st.ok}/${N} · ${s.lvl[L-1]}</p>${nr?`<p class="g" style="text-align:center;font-weight:700">${s.rec}</p>`:`<p class="sub" style="text-align:center">${s.best} : ${b}</p>`}<button class="go" data-go="1">${s.again}</button><button class="ghost" data-home="1">${s.home}</button>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.lang){lang=d.lang;ls.set('tv_lang',lang);document.documentElement.lang=lang;home()}
else if(d.lvl){L=+d.lvl;ls.set('tv_lvl',L);home()}
else if(d.go)play();else if(d.opt!==undefined)answer(+d.opt);else if(d.next)next();else if(d.home)home()});
app.addEventListener('change',e=>{if(e.target.id=='cat'){cat=e.target.value;ls.set('tv_cat',cat)}});
document.documentElement.lang=lang;home();
</script>
</body>
</html>
